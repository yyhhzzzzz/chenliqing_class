<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI 智慧课堂学生专注度检测系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: center;
            animation: fadeInUp 0.8s var(--transition);
        }
        .login-header {
            margin-bottom: 30px;
        }
        .login-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e293b 30%, #4f46e5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }
        .form-control:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .login-error-msg {
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid rgba(220, 38, 38, 0.2);
            color: var(--danger);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            color: white;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 15px var(--primary-glow);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }
        .login-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- 背景粒子光晕 -->
        <div class="bg-decor"></div>
        <div class="bg-decor-2"></div>

        <div class="glass-panel login-card">
            <div class="login-header">
                <h2>🏫 智慧课堂管理平台</h2>
                <p>教师登录授权验证系统</p>
            </div>

            <!-- 登录表单 -->
            <form action="{{ url_for('main.login') }}" method="POST" id="login-form">
                <!-- CSRF 防护标签 -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                {% if error %}
                <div class="login-error-msg">
                    <span>⚠️</span> {{ error }}
                </div>
                {% endif %}

                <div class="form-group">
                    <label for="username">👤 教师用户名</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="请输入用户名" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">🔒 安全登录密码</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="请输入密码" required autocomplete="current-password">
                </div>

                <button type="submit" class="login-btn">
                    <span>🚪</span> 安全登录
                </button>
            </form>
        </div>
    </div>
</body>
</html>
