<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智慧课堂 - 学生专注度检测系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="bg-decor"></div>
        <div class="bg-decor-2"></div>

        <header>
            <h1>🏫 智慧课堂专注度管理系统</h1>
            <p>基于 YOLOv8 的实时教学质量量化分析平台</p>
        </header>

        <!-- 课堂控制面板 -->
        <div class="glass-panel control-card">
            <div class="status-indicator" id="class-status-box">
                <span class="pulse-dot grey" id="status-dot"></span>
                <span id="status-text">课堂未开始</span>
            </div>
            
            <div class="button-group">
                <button type="button" class="action-btn start" id="start-class-btn">
                    <span class="icon">▶️</span> 开始上课
                </button>
                <button type="button" class="action-btn end" id="end-class-btn" disabled>
                    <span class="icon">⏹️</span> 下课统计
                </button>
            </div>
        </div>

        <!-- 实时画面监控 -->
        <div class="glass-panel monitor-card">
            <div class="monitor-container">
                <img id="video-stream" src="{{ url_for('video_feed') }}" alt="监控画面连接中...">
                <div class="monitor-overlay" id="monitor-overlay" style="display: none;">
                    <div class="ai-active-tag">AI 实时分析中</div>
                </div>
            </div>
        </div>

        <!-- 实时统计数据面板 -->
        <div class="glass-panel stats-card">
            <h3>📈 实时课堂数据</h3>
            <div class="realtime-stats-grid">
                <div class="rt-stat-item">
                    <span class="rt-label">当前总人数</span>
                    <span class="rt-value" id="stat-total">0</span>
                </div>
                <div class="rt-stat-item">
                    <span class="rt-label">出勤人数</span>
                    <span class="rt-value listening" id="stat-listening">0</span>
                </div>
                <div class="rt-stat-item">
                    <span class="rt-label">分心人数</span>
                    <span class="rt-value distracted" id="stat-distracted">0</span>
                </div>
                <div class="rt-stat-item">
                    <span class="rt-label">抬头率</span>
                    <span class="rt-value attention" id="stat-attention">0.0%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start-class-btn');
            const endBtn = document.getElementById('end-class-btn');
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            const monitorOverlay = document.getElementById('monitor-overlay');

            // 实时统计元素
            const statTotal = document.getElementById('stat-total');
            const statListening = document.getElementById('stat-listening');
            const statDistracted = document.getElementById('stat-distracted');
            const statAttention = document.getElementById('stat-attention');

            let statsInterval = null;

            // 0. 同步状态逻辑
            async function syncStatus() {
                try {
                    const response = await fetch('/get_status');
                    const data = await response.json();
                    if (data.is_active) {
                        startBtn.disabled = true;
                        endBtn.disabled = false;
                        statusText.textContent = `正在上课 (Session: ${data.session_id})`;
                        statusDot.className = 'pulse-dot red';
                        monitorOverlay.style.display = 'block';
                        startStatsUpdate();
                    } else {
                        startBtn.disabled = false;
                        endBtn.disabled = true;
                        statusText.textContent = '课堂未开始';
                        statusDot.className = 'pulse-dot grey';
                        monitorOverlay.style.display = 'none';
                        stopStatsUpdate();
                        clearStats();
                    }
                } catch (err) {
                    console.error('Sync status failed:', err);
                }
            }
            syncStatus();

            // 获取实时统计数据
            async function fetchStats() {
                try {
                    const response = await fetch('/latest_stats');
                    const data = await response.json();
                    updateStatsDisplay(data);
                } catch (err) {
                    console.error('Fetch stats failed:', err);
                }
            }

            // 更新统计显示
            function updateStatsDisplay(stats) {
                statTotal.textContent = stats.total || 0;
                statListening.textContent = stats.listening || 0;
                statDistracted.textContent = stats.distracted || 0;
                statAttention.textContent = stats.attention_rate || '0.0%';
            }

            // 清空统计显示
            function clearStats() {
                statTotal.textContent = '0';
                statListening.textContent = '0';
                statDistracted.textContent = '0';
                statAttention.textContent = '0.0%';
            }

            // 开始定时更新统计
            function startStatsUpdate() {
                if (statsInterval) return;
                fetchStats();
                statsInterval = setInterval(fetchStats, 3000);
            }

            // 停止定时更新
            function stopStatsUpdate() {
                if (statsInterval) {
                    clearInterval(statsInterval);
                    statsInterval = null;
                }
            }

            // 1. 开始上课
            startBtn.addEventListener('click', async () => {
                try {
                    const response = await fetch('/start_class', { method: 'POST' });
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        // 更新 UI 状态
                        startBtn.disabled = true;
                        endBtn.disabled = false;
                        statusText.textContent = `正在上课 (Session: ${data.session_id})`;
                        statusDot.className = 'pulse-dot red';
                        monitorOverlay.style.display = 'block';
                        startStatsUpdate();
                    }
                } catch (error) {
                    console.error('Start class error:', error);
                    alert('启动失败，请检查后端连接');
                }
            });

            // 2. 下课统计
            endBtn.addEventListener('click', async () => {
                if (!confirm('确定要下课并生成统计报告吗？')) return;

                try {
                    const response = await fetch('/end_class', { method: 'POST' });
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        // 更新 UI 状态
                        startBtn.disabled = false;
                        endBtn.disabled = true;
                        statusText.textContent = '课堂已结束，数据已发送至管理端';
                        statusDot.className = 'pulse-dot grey';
                        monitorOverlay.style.display = 'none';
                        stopStatsUpdate();
                        clearStats();

                        alert(`下课成功！\n本节课平均抬头率: ${data.report.avg_attention_rate}\n报告已发送至管理端。`);
                    }
                } catch (error) {
                    console.error('End class error:', error);
                    alert('提交失败');
                }
            });
        });
    </script>
</body>
</html>
